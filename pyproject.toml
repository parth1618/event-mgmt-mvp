[project]
name = "event-mgmt-mvp"
version = "1.0.0"
description = "Event Management Platform Backend MVP"
authors = [{ name = "Parth Joshi", email = "parthjoshi.1618@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["fastapi", "event-management", "backend", "mvp", "ticketing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.104.0,<0.115.0",
    "uvicorn[standard]>=0.24.0,<0.30.0",
    "sqlalchemy[asyncio]>=2.0.23,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "alembic>=1.12.1,<1.14.0",
    "pydantic[email]>=2.5.0,<2.10.0",
    "pydantic-settings>=2.1.0,<2.6.0",
    "python-jose[cryptography]>=3.3.0,<3.4.0",
    "passlib[bcrypt]>=1.7.4,<1.8.0",
    "python-multipart>=0.0.6,<0.1.0",
    "aiofiles>=23.2.1,<25.0.0",
    "boto3>=1.34.0,<1.36.0",
    "stripe>=7.8.0,<11.0.0",
    "redis[hiredis]>=5.0.1,<6.0.0",
    "celery[redis]>=5.3.4,<6.0.0",
    "reportlab>=4.0.7,<5.0.0",
    "qrcode[pil]>=7.4.2,<8.0.0",
    "loguru>=0.7.2,<0.8.0",
    "python-dotenv>=1.0.0,<1.1.0",
    "slowapi>=0.1.9,<0.2.0",
    "sendgrid>=6.11.0,<7.0.0",
    "ruff>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3,<8.4.0",
    "pytest-asyncio>=0.21.1,<0.25.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "httpx>=0.25.2,<0.28.0",
    "black>=23.12.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.7.1,<1.14.0",
    "flake8>=6.1.0,<8.0.0",
    "flake8-docstrings>=1.7.0,<2.0.0",
    "bandit>=1.7.5,<1.8.0",
    "safety>=3.0.0,<4.0.0",
    "ipython>=8.18.1,<9.0.0",
    "ipdb>=0.13.13,<0.14.0",
    "watchfiles>=0.21.0,<0.25.0",
    "pre-commit>=3.5.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/", ".venv/"]

[[tool.mypy.overrides]]
module = ["celery.*", "reportlab.*", "qrcode.*", "boto3.*", "stripe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-branch",
    "--no-cov-on-fail",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101", "B601"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "B904", # 
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"migrations/*" = ["E501"]
