version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: event-mgmt-mvp-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: event-mgmt-mvp-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    restart: always
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: event-mgmt-mvp-backend:latest
    container_name: event-mgmt-mvp-api-prod
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - backend
      - frontend
    volumes:
      - ./logs:/var/log/event-mgmt-mvp
    command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  celery-worker:
    image: event-mgmt-mvp-backend:latest
    container_name: event-mgmt-mvp-celery-worker-prod
    env_file:
      - .env.prod
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - backend
    volumes:
      - ./logs:/var/log/event-mgmt-mvp
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=8
    deploy:
      replicas: 3

  celery-beat:
    image: event-mgmt-mvp-backend:latest
    container_name: event-mgmt-mvp-celery-beat-prod
    env_file:
      - .env.prod
    depends_on:
      - postgres
      - redis
    restart: always
    networks:
      - backend
    command: celery -A app.tasks.celery_app beat --loglevel=info

  nginx:
    image: nginx:alpine
    container_name: event-mgmt-mvp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    restart: always
    networks:
      - frontend

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge